<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Multi API Data Display</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Multi-API Data Display</h1>
            <p>Fetch Posts, Products and Todos using Promise Chaining</p>

            <button id="fetchBtn">
                Fetch All Data
            </button>

            <p id="status"></p>
        </header>


        <!-- API 1 : Posts -->
        <section class="api-section">
            <h2>📝 Posts</h2>

            <div class="table-container">
                <table id="postsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Body</th>
                            <th>Views</th>
                        </tr>
                    </thead>

                    <tbody id="postsBody">
                        <tr>
                            <td colspan="4">
                                Waiting for API 1...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>


        <!-- API 2 : Products -->
        <section class="api-section">
            <h2>🛒 Products</h2>

            <div class="table-container">
                <table id="productsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Rating</th>
                        </tr>
                    </thead>

                    <tbody id="productsBody">
                        <tr>
                            <td colspan="5">
                                Waiting for API 2...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>


        <!-- API 3 : Todos -->
        <section class="api-section">
            <h2>✅ Todos</h2>

            <div class="table-container">
                <table id="todosTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Todo</th>
                            <th>Completed</th>
                            <th>User ID</th>
                        </tr>
                    </thead>

                    <tbody id="todosBody">
                        <tr>
                            <td colspan="4">
                                Waiting for API 3...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </div>
    <script src="script.js"></script>

</body>
</html>
